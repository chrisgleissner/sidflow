name: Engine Parity

# Formal comparative analysis: the WASM libsidplayfp build vs a NATIVE build of
# the exact same upstream refs.
#
# The fast half of this check already runs inside the unit suite
# (packages/libsidplayfp-wasm/test/engine-parity.test.ts) by comparing against
# recorded goldens. This job is the half that produces those goldens' authority:
# it builds libsidplayfp + libresidfp natively at the pinned refs, renders the
# same fixtures through both engines, and requires them to agree.
#
# It exists because the published WASM artifact was silently wrong for months —
# SIDLite instead of reSIDfp, a corrupted mixer buffer contract, and a
# heap-use-after-free that made it 10 dB too bright. Every one of those built,
# loaded, rendered and returned plausible sample counts. Only a comparison
# against a correct build of the same library shows them up.

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-parity:
    name: WASM vs native libsidplayfp
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # xa65 is the 6502 assembler for src/psiddrv.a65 and the sidplayer drivers.
      # Ubuntu's xa65 package installs the binary as `xa`, which is the name
      # libsidplayfp's configure probes for. Its absence is not a configure
      # error, only a make one, so it has to be installed up front.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config git xa65

      # The native reference is pinned to the same refs as the WASM build and
      # keyed on them, so it is rebuilt only when the pin actually moves.
      - name: Restore native reference
        id: native-cache
        uses: actions/cache@v4
        with:
          path: packages/libsidplayfp-wasm/.cache/native-reference
          key: >-
            native-reference-${{ runner.os }}-${{
              hashFiles('packages/libsidplayfp-wasm/docker/entrypoint.sh',
                        'packages/libsidplayfp-wasm/scripts/native-reference/render.cpp',
                        'packages/libsidplayfp-wasm/scripts/build-native-reference.sh')
            }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compare WASM engine against native libsidplayfp
        run: |
          cd packages/libsidplayfp-wasm
          bun run scripts/native-parity.mjs

      # Note: there is deliberately no "regenerate and assert no diff" step. The
      # engine has a ~-80 dBFS run-to-run noise floor, so regenerating always
      # produces slightly different numbers and such a check would be flaky.
      # Golden staleness is covered instead by the unit suite, which asserts the
      # goldens' recorded upstream refs still match docker/entrypoint.sh and that
      # the artifact matches them within tolerance.
