name: Release Docker Image

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.0 or v0.5.0-rc1)"
        required: true
        type: string

concurrency:
  group: release-docker-${{ github.ref_name || github.event.inputs.tag || 'manual' }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME || 'main' }}

      - name: Determine version
        id: version
        run: |
          TAG="${TAG_NAME}"
          CLEAN="${TAG#v}"
          if [ -z "${CLEAN}" ] || ! printf '%s' "${CLEAN}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid or empty tag: '${TAG}'. Provide a semver tag (e.g. v0.5.0 or v0.5.0-rc1)." >&2
            exit 1
          fi
          MAJOR="${CLEAN%%.*}"
          REST="${CLEAN#${MAJOR}.}"
          MINOR="${REST%%.*}"
          if printf '%s' "${CLEAN}" | grep -q -- '-'; then
            IS_PRERELEASE=true
            {
              echo "docker_tags<<EOF"
              echo "type=raw,value=${CLEAN}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            IS_PRERELEASE=false
            {
              echo "docker_tags<<EOF"
              echo "type=raw,value=${CLEAN}"
              echo "type=raw,value=${MAJOR}.${MINOR}"
              echo "type=raw,value=${MAJOR}"
              echo "type=raw,value=latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Auto-generate CHANGES.md entry if missing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Check if this version already exists in CHANGES.md
          if grep -q "^## ${VERSION} " CHANGES.md; then
            echo "✓ CHANGES.md already has entry for ${VERSION}"
            exit 0
          fi
          
          echo "Generating CHANGES.md entry for ${VERSION}..."
          
          # Find previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1 || echo "")
          
          if [ -z "${PREV_TAG}" ]; then
            echo "No previous tag found, collecting all commits"
            COMMITS=$(git log --oneline --pretty=format:"- %s" HEAD)
          else
            echo "Previous tag: ${PREV_TAG}"
            COMMITS=$(git log --oneline --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          
          # Create temporary file with new entry
          {
            echo ""
            echo "## ${VERSION} ($(date +%Y-%m-%d))"
            echo ""
            echo "${COMMITS}"
            echo ""
          } > /tmp/new-entry.md
          
          # Prepend to CHANGES.md (after the title)
          {
            head -n 2 CHANGES.md  # Keep "# Changelog" and blank line
            cat /tmp/new-entry.md
            tail -n +3 CHANGES.md
          } > /tmp/CHANGES.md.new
          
          mv /tmp/CHANGES.md.new CHANGES.md
          
          echo "✓ Added CHANGES.md entry for ${VERSION}"
          
          # Configure git for commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and push the changes
          git add CHANGES.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CHANGES.md for ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Extract changelog entry
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # awk reads CHANGES.md directly rather than being fed the rest of the file
          # through a pipe. The previous shape piped every byte after the heading into
          # `awk '/^## /{exit}'`, and awk exits at the NEXT heading, so once the text
          # below the extracted entry grew past the 64 KiB pipe buffer printf blocked,
          # took EPIPE when awk left, and `set -o pipefail` failed the release. That is
          # what broke the 0.8.3 release: the file crossed the buffer size. Reading the
          # file directly means there is no pipe to break, whatever the file's size.
          ENTRY=$(awk -v header="## ${VERSION} " '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGES.md)
          # Only leading and trailing blank lines are removed. The previous
          # `sed '/^[[:space:]]*$/d'` deleted every blank line, including the ones between
          # paragraphs and sections, so a generated release note arrived as one unbroken
          # block: 0.8.3 published 92 lines with 2 blank, against 11 blank in 0.8.1.
          ENTRY_TRIMMED=$(printf "%s\n" "${ENTRY}" | awk '
            /[^[:space:]]/ { for (; pending > 0; pending--) print ""; print; started = 1; next }
            started { pending++ }
          ')
          {
            echo "entry<<EOF"
            echo "${ENTRY_TRIMMED}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Configure buildx with latest buildkit and host networking
          driver: docker-container  # Explicit driver selection
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.docker_tags }}
          labels: |
            org.opencontainers.image.title=SIDFlow
            org.opencontainers.image.description=C64 music player with mood-based classification
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable attestations completely to reduce manifest size and upload issues
          provenance: false
          sbom: false

      - name: Smoke test Docker image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          DOCKER_SMOKE_MODE: pull
          CONTAINER_NAME: sidflow-smoke-test-${{ github.run_id }}
          PORT: "3000"
        run: |
          set -euo pipefail
          bash scripts/docker-smoke.sh

      - name: Update GitHub release notes
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          BODY: ${{ steps.changelog.outputs.entry }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          IMAGE_LINE="Docker image: ghcr.io/${REPO}:${TAG}"
          if [ -n "${BODY}" ]; then
            printf "%s\n\n%s\n" "${BODY}" "${IMAGE_LINE}" > "${NOTES_FILE}"
          else
            printf "%s\n" "${IMAGE_LINE}" > "${NOTES_FILE}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}" --title "${TAG}"
          else
            gh release create "${TAG}" --notes-file "${NOTES_FILE}" --title "${TAG}"
          fi
